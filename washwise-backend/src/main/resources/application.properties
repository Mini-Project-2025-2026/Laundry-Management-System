# =========================================================
# Smart Laundry Management System - Application Configuration
# =========================================================

spring.application.name=washwise-backend

# ---------------------------------------------------------
# Default: in-memory H2 database.
# This lets the project run immediately with zero setup.
# Console available at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:laundrydb  |  user: sa  |  password: (blank)
# ---------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:laundrydb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------
# To switch to MySQL (recommended for production/deployment):
# 1. Comment out the H2 block above.
# 2. Uncomment the block below and update credentials.
# 3. Create the database first: CREATE DATABASE laundry_db;
# ---------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/laundry_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_password_here

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

server.port=8080

# ---------------------------------------------------------
# JWT auth (marketplace app: customers + laundry owners)
# The secret below is fine for local development only.
# Generate a fresh random 256-bit+ secret before deploying anywhere real,
# e.g.: openssl rand -base64 48
# ---------------------------------------------------------
app.jwt.secret=Zm9yLWxvY2FsLWRldi1vbmx5LXJlcGxhY2UtbWUtYmVmb3JlLWRlcGxveWluZy1hbnl3aGVyZS1yZWFsLTEyMzQ1Njc4OTA=
app.jwt.expiration-ms=604800000

# Paystack: keep the secret in the server environment, never in source control.
# PAYSTACK_SECRET_KEY=sk_test_... mvn spring-boot:run
paystack.secret-key=${PAYSTACK_SECRET_KEY:}
paystack.callback-url=${PAYSTACK_CALLBACK_URL:https://washwise.app/payment/callback}
